name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore InventiCore.sln

    - name: Build
      run: dotnet build InventiCore.sln --no-restore -c Release

    - name: Test
      run: dotnet test InventiCore.sln --no-build --verbosity normal -c Release
